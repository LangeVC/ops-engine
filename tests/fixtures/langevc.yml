# Pre-migration layover config for langevc (lvc-ops).
# The org key sits at the top level, as a display-cased GitHub handle.
# LNF-100-1: check must fail on this file.
LangeVC:
  auto_triage:
    add_needs_triage_label: true
    keyword_labels:
      "feat": "enhancement"
      "fix": "bug"
  stale_management:
    days_until_stale: 90
  repositories:
    ops-engine:
      release:
        enabled: true
    envctl:
      mirror:
        enabled: true
