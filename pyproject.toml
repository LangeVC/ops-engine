[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ops-engine"
version = "3.1.0"
description = "Event-driven multi-org release orchestration engine for GitHub and Forgejo."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "LangeVC", email = "oss@langevc.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]
# Postgres driver for the MigrationRunner module (CORE-007). Optional so the
# core package stays driver-free; layovers that use migrations install with
# ``pip install 'ops-engine[postgres]'``.
postgres = [
    "psycopg2-binary>=2.9.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ops_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
