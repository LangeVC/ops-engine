# Layer-3 repository override (DST-002): the release destinations for this
# repository. The forge is a value, not a key name (DST-001). This is the
# config layer — the only place an organisation name, a forge repository, or a
# role is declared. The release workflow reads this file via
# config_loader.load_ops_yaml and resolves BOTH destinations from it; nothing
# here is restated as a literal in .forgejo/.
destinations:
  - forge: forgejo
    repo: langevc/ops-engine
    role: release
    visibility: public
  - forge: github
    repo: LangeVC/ops-engine
    role: release
    visibility: public

# The organisation's tracker prefixes (REL-021). The release workflow reads them
# from here and hands them to the audience gate, so no workflow carries an
# organisation's vocabulary as a literal. An adopter declares their own; one that
# declares none gets no tracker check, which is the correct default rather than a
# hole — the same shape an absent forge host and an absent layover register take.
tracker_prefixes: [LVC, OME, CORE, LNF, DST, REL, CFG, FFR, ADP]

# The organisation's canonical forge host (REL-023). The release gate reads this
# from here and feeds it to the destination/host boundary gate as the org-host
# vocabulary, so the gate refuses a hardcoded canonical host rather than a
# runner-internal container address (github.server_url resolves to
# http://forgejo:3000 on the runner, which is not the organisation's forge). A
# dotless entry is refused by the gate by name; nothing here is restated as a
# literal in .forgejo/.
forge_hosts: [git.langevc.com]
