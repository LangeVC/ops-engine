name: Release gate

# One gate, one code path. A stable release tag and an rc (prerelease) tag
# traverse this same workflow and the same gate invocation. The only
# difference is one derived flag: a prerelease tag is permitted, a stable tag
# is not. A mismatched version turns the run red here, before any release
# object exists.
#
# REL-003 — the SBOM is not a document, it is a gate input. The reproducible
# build (REL-002) emits sbom.cdx.json as one of the four release assets. This
# workflow additionally runs osv-scanner over that SBOM and refuses the tag
# when a finding meets or exceeds the severity floor. The floor is a decision,
# not a default; it is stated and defended below in the `osv-gate` job.
#
# REL-009 — the SBOM is a release ASSET, not a committed file, and it is
# published by forgejo-release.yml. Both workflows trigger on the SAME
# `push: tags` event and run concurrently. The osv-gate below therefore does
# not read `sbom.cdx.json` from the checkout (which never carries it); it waits
# under a HARD bound for the canonical release and its SBOM asset, downloads
# that asset, and only then scans it. On expiry — the release or its SBOM
# still absent after the bound elapses — the SAME NoSbomToScanError refusal
# fires, never a silent pass. The bound is enumerated in the step and the
# job-level `timeout-minutes` is a second, independent ceiling.
on:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Check tag against the declared version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##refs/tags/}"
          args=(check-tag "$tag")
          version="${tag#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            args+=(--allow-prereleases)
          fi
          python3 scripts/version-sync.py "${args[@]}"

  # REL-003: OSV gate over the SBOM. It fails the release above a STATED
  # severity floor and names what it does NOT cover, so a green run is read for
  # exactly what it is.
  #
  # Floor: CVSS base score 7.0 (HIGH and CRITICAL) blocks the release.
  # Rationale (PRD 8): a floor set too high never fires, so it is a green that
  # lies; a floor set too low blocks every release and is disabled within a
  # month. HIGH/CRITICAL are the classes a release should not ship; MEDIUM and
  # LOW are surfaced but tolerated, which keeps the gate usable without
  # surrendering the line it draws. Floor is expressed in CVSS base score (a
  # single ordinal both OSV and GHSA/PyPA publish) rather than an advisory's
  # free-text severity word, which not all advisories carry.
  osv-gate:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Wait for, then download, the SBOM release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##refs/tags/}"
          version="${tag#v}"

          # A prerelease (rc/dev) tag is permitted through the version gate but
          # does not carry the release SBOM yet, so nothing to scan is the
          # correct, explicit result rather than a hidden pass. Only stable
          # release tags must carry and clear the SBOM. This short-circuit runs
          # BEFORE any release lookup, so a prerelease never blocks on a release
          # that was never built for it.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "osv-gate: prerelease tag ${tag}; SBOM gate applies at stable release. SKIP"
            exit 0
          fi

          # REL-009: the SBOM is one of the four assets forgejo-release.yml
          # uploads AFTER it creates the release. Poll the canonical release for
          # its sbom.cdx.json asset under a HARD bound, then download it into the
          # workspace where osv-scanner expects it. A stable tag whose release
          # or SBOM never materialises within the bound is a named failure —
          # never a silent green.
          SBOM_WAIT_ATTEMPTS=40
          SBOM_WAIT_SLEEP=15
          attempt=1
          sbom_url=""
          while [ "$attempt" -le "$SBOM_WAIT_ATTEMPTS" ]; do
            if REL="$(curl -fsSL \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              -H "Authorization: token ${GITHUB_TOKEN}" 2>/dev/null)"; then
              REL_ID_TMP="$(printf '%s' "$REL" | jq -r '.id' 2>/dev/null)"
              sbom_url="$(curl -fsSL \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${REL_ID_TMP}/assets" \
                -H "Authorization: token ${GITHUB_TOKEN}" 2>/dev/null \
                | jq -r '.[] | select(.name == "sbom.cdx.json") | .browser_download_url' 2>/dev/null \
                | head -n1)"
              if [ -n "$sbom_url" ] && [ "$sbom_url" != "null" ]; then
                break
              fi
            fi
            echo "osv-gate: waiting for the SBOM asset of release ${tag}: attempt ${attempt}/${SBOM_WAIT_ATTEMPTS}"
            attempt=$((attempt + 1))
            sleep "$SBOM_WAIT_SLEEP"
          done

          if [ -z "$sbom_url" ] || [ "$sbom_url" = "null" ]; then
            echo "::error::NoSbomToScanError: sbom.cdx.json missing on stable tag ${tag}. The reproducible build must have emitted it as a release asset. Nothing was scanned, so nothing is approved." >&2
            exit 1
          fi

          curl -fsSL -o sbom.cdx.json \
            -H "Authorization: token ${GITHUB_TOKEN}" "$sbom_url"
          echo "osv-gate: downloaded sbom.cdx.json from the release ${tag}."

      - name: Gate the SBOM against OSV
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##refs/tags/}"
          version="${tag#v}"

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "osv-gate: prerelease tag ${tag}; SBOM gate applies at stable release. SKIP"
            exit 0
          fi

          # The SBOM is an input this gate consumes, not a file this gate
          # fabricates. A stable release tag must carry REL-002's SBOM; its
          # absence is a named failure, never a silent green.
          if [[ ! -f "sbom.cdx.json" ]]; then
            echo "::error::NoSbomToScanError: sbom.cdx.json missing on stable tag ${tag}. The reproducible build must have emitted it as a release asset. Nothing was scanned, so nothing is approved." >&2
            exit 1
          fi

          # osv-scanner is pinned with its published SHA256 rather than a bare
          # redirect, so the tool that decides the release is the version this
          # gate was written against and nothing newer silently.
          scanner_version=2.5.1
          sha=f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
          url="https://github.com/google/osv-scanner/releases/download/v${scanner_version}/osv-scanner_linux_amd64"
          curl -fsSL -o /tmp/osv-scanner "$url"
          printf '%s  %s\n' "$sha" "/tmp/osv-scanner" | sha256sum -c - >/dev/null
          chmod +x /tmp/osv-scanner

          echo "osv-gate: scanning sbom.cdx.json against OSV (scanner ${scanner_version})"
          echo "osv-gate: floor = CVSS base score 7.0 (HIGH/CRITICAL blocks; MEDIUM/LOW surfaced below)."

          # The gate's decision is made over the JSON osv-scanner emits, so the
          # exit code below is the gate's, not the scanner's habit of exiting
          # non-zero on ANY finding. The scan JSON is written to a temp file and
          # read back, so the heredoc owns stdin cleanly.
          /tmp/osv-scanner scan --sbom=sbom.cdx.json --format=json 2>/dev/null \
            > /tmp/osv-scan.json
          OSV_SCAN_JSON=/tmp/osv-scan.json python3 - <<'PY'
          import json
          import os
          import sys

          FLOOR = 7.0  # CVSS base score; must match the prose floor above.
          with open(os.environ["OSV_SCAN_JSON"], encoding="utf-8") as fh:
              data = json.load(fh)
          findings = 0
          worst = 0.0
          rows = []
          for res in data.get("results", []):
              for pkg in res.get("packages", []):
                  name = (pkg.get("package") or {}).get("name", "unknown")
                  for group in pkg.get("groups", []):
                      ids = group.get("ids", [])
                      raw = group.get("max_severity")
                      score = None
                      if raw:
                          try:
                              score = float(raw)
                          except (TypeError, ValueError):
                              score = None
                      findings += 1
                      if score is not None:
                          worst = max(worst, score)
                          rows.append((name, ";".join(ids[:2]), score))
                      else:
                          rows.append((name, ";".join(ids[:2]), None))

          print(f"osv-gate: {findings} advisories; highest CVSS base score {worst:g}; floor {FLOOR:g}")
          for name, ids, score in sorted(rows):
              if score is None:
                  print(f"osv-gate:   {name:<36} {ids}  (no CVSS base score published)")
              else:
                  verdict = "BLOCK" if score >= FLOOR else "OK"
                  print(f"osv-gate:   {verdict:<5} {name:<36} {score:g}  {ids}")

          # What this green does NOT mean, stated at the moment of the verdict
          # so no reader mistakes it for a clean bill of health:
          print("osv-gate: NOT covered: advisories published AFTER this scan (the OSV database is", end=" ")
          print("itself a snapshot); and unpinned transitive resolution at the consumer's install", end=" ")
          print("time (LVC-249) is out of scope of this SBOM, which pins only the build set.")

          if worst >= FLOOR:
              print(f"osv-gate: RELEASE REFUSED (highest {worst:g} >= floor {FLOOR:g})")
              sys.exit(1)
          print("osv-gate: RELEASE PERMITTED")
          sys.exit(0)
          PY
