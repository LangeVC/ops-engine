name: Create Forgejo Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # The release body is the CHANGELOG entry for this version, not commit
      # subjects. A tag whose version has no `## X.Y.Z` section fails here,
      # before any release object exists. ChangelogParser understands both
      # heading forms present in CHANGELOG.md: `## 3.1.0` and
      # `## [2.1.2] — 2026-06-04`.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          NOTES="$(python3 - "$TAG_NAME" <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ops_engine.utils.changelog_parser import ChangelogParser

          tag = sys.argv[1]
          version = tag.lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              content = fh.read()
          notes = ChangelogParser.extract_version_notes(content, version)
          if not notes:
              sys.stderr.write(
                  "MissingChangelogEntryError: no '## %s' section in CHANGELOG.md; "
                  "a release with no notes would post commit subjects, so the "
                  "release is refused.\n" % version
              )
              sys.exit(2)
          sys.stdout.write(notes)
          PY
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"

          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "${NOTES}" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false}')

          echo "Creating Forgejo release for $TAG_NAME..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" != "201" ]; then
            echo "Failed to create release. HTTP $HTTP_STATUS"
            cat response.json
            exit 1
          fi

          echo "Release created successfully."
